name: TaskFlow CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build backend
        run: docker build -t taskflow-backend ./backend

      - name: Build frontend
        run: docker build -t taskflow-frontend ./frontend
